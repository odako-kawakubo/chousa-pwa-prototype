<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>調査システムPWA</title>
<style>
:root{--bg:#f5f7fb;--panel:#fff;--line:#d6dce8;--text:#1f2937;--muted:#64748b;--main:#2563eb;--main2:#eaf1ff;--green:#16a34a;--orange:#f59e0b}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;min-height:100vh;display:flex;align-items:center;justify-content:center;padding:18px}.card{width:520px;max-width:100%;background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 10px 30px rgba(15,23,42,.08)}h1{font-size:22px;margin:0 0 8px}.version{display:inline-block;border:1px solid var(--line);border-radius:999px;padding:4px 10px;font-size:13px;background:var(--main2);color:#1d4ed8;margin:6px 0 12px}.hint{font-size:13px;color:var(--muted);line-height:1.7;margin:8px 0 16px}.actions{display:flex;gap:8px;flex-wrap:wrap}.btn{border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 14px;font-size:14px;cursor:pointer;text-decoration:none;color:var(--text);display:inline-flex;align-items:center;justify-content:center}.btn.primary{background:var(--main);border-color:var(--main);color:#fff}.status{margin-top:14px;font-size:12px;color:var(--muted);line-height:1.6}.small{font-size:12px;color:var(--muted);margin-top:16px;border-top:1px solid var(--line);padding-top:12px}
</style>
</head>
<body>
<div class="card">
  <h1>調査システムPWA</h1>
  <div class="version" id="versionLabel">最新版確認中...</div>
  <p class="hint">ホーム画面やブックマークはこの入口ページのままでOK。最新版の本体ファイルを開きます。</p>
  <div class="actions">
    <a class="btn primary" id="openLatest" href="app-v0.8.9.html">最新版を開く</a>
    <button class="btn" onclick="checkVersion(true)">更新確認</button>
  </div>
  <div class="status" id="status">version.json を確認しています。</div>
  <div class="small">iPadで古い画面が残る場合も、入口はそのままにして最新版ファイルへ移動する方式です。</div>
</div>
<script>
const fallback={latestVersion:'0.8.9',latestFile:'app-v0.8.9.html'};
function setLatest(info){
  const file=info.latestFile||fallback.latestFile;
  const version=info.latestVersion||fallback.latestVersion;
  const url=file+'?v='+encodeURIComponent(version);
  document.getElementById('versionLabel').textContent='最新版 v'+version;
  document.getElementById('openLatest').href=url;
  document.getElementById('status').textContent='最新版ファイル: '+file;
}
async function checkVersion(showAlert){
  try{
    const res=await fetch('version.json?ts='+Date.now(),{cache:'no-store'});
    if(!res.ok)throw new Error('version.json not found');
    const info=await res.json();
    setLatest(info);
    if(showAlert)alert('最新版 v'+(info.latestVersion||fallback.latestVersion)+' を確認しました。');
  }catch(e){
    setLatest(fallback);
    document.getElementById('status').textContent='version.jsonを読めなかったため、固定の最新版を表示しています。';
    if(showAlert)alert('更新情報を読めませんでした。固定の最新版を開いてください。');
  }
}
checkVersion(false);
</script>
</body>
</html>
