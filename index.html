<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>調査システムPWA 起動</title>
<style>
  :root{--bg:#f5f7fb;--panel:#fff;--line:#d6dce8;--text:#1f2937;--muted:#64748b;--main:#2563eb;--green:#16a34a;--warn:#f59e0b}
  *{box-sizing:border-box}body{margin:0;min-height:100vh;background:var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans JP",sans-serif;display:flex;align-items:center;justify-content:center;padding:20px}
  .card{width:440px;max-width:100%;background:#fff;border:1px solid var(--line);border-radius:18px;padding:22px;box-shadow:0 8px 24px rgba(15,23,42,.08)}
  h1{font-size:20px;margin:0 0 8px}.hint{font-size:13px;color:var(--muted);line-height:1.6}.status{margin:14px 0;padding:10px 12px;border-radius:12px;background:#f8fafc;border:1px solid var(--line);font-size:13px}.ok{color:var(--green);font-weight:700}.warn{color:var(--warn);font-weight:700}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:16px}.btn{display:inline-flex;align-items:center;justify-content:center;border:1px solid var(--line);background:#fff;border-radius:10px;padding:10px 12px;font-size:14px;color:var(--text);text-decoration:none;cursor:pointer}.btn.primary{background:var(--main);border-color:var(--main);color:#fff}.btn:active{transform:translateY(1px)}.small{font-size:12px;color:var(--muted);margin-top:12px}
</style>
</head>
<body>
  <main class="card">
    <h1>調査システムPWA</h1>
    <div class="hint">ここは固定の入口ページです。最新版の本体ファイルを確認して開きます。</div>
    <div class="status" id="status">最新版を確認中...</div>
    <div class="actions">
      <a class="btn primary" id="openLatest" href="./app-v0.8.5.html">最新版を開く</a>
      <button class="btn" onclick="checkLatest()">更新確認</button>
      <a class="btn" href="./app-v0.8.5.html" id="fallback">v0.8.5を直接開く</a>
    </div>
    <div class="small">iPadで更新されにくい場合でも、この入口から最新版ファイルへ移動します。URLを毎回打つ必要はありません。</div>
  </main>
<script>
const FALLBACK_VERSION='0.8.5';
const FALLBACK_APP='app-v0.8.5.html';
function stamped(path){const u=new URL(path, location.href); u.searchParams.set('v', Date.now()); return u.toString();}
async function checkLatest(){
  const status=document.getElementById('status');
  const open=document.getElementById('openLatest');
  status.textContent='最新版を確認中...';
  try{
    const res=await fetch('./version.json?ts='+Date.now(), {cache:'no-store'});
    if(!res.ok) throw new Error('version.json not found');
    const info=await res.json();
    const version=info.version || FALLBACK_VERSION;
    const app=info.app || FALLBACK_APP;
    const url=stamped('./'+app.replace(/^\.\//,''));
    open.href=url;
    open.textContent='最新版 v'+version+' を開く';
    document.getElementById('fallback').href=url;
    status.innerHTML='<span class="ok">最新版：v'+version+'</span><br>'+app;
  }catch(e){
    const url=stamped('./'+FALLBACK_APP);
    open.href=url;
    open.textContent='v'+FALLBACK_VERSION+' を開く';
    status.innerHTML='<span class="warn">version.jsonを読めませんでした。</span><br>予備として v'+FALLBACK_VERSION+' を開けます。';
  }
}
checkLatest();
</script>
</body>
</html>
